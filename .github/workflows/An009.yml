name: An009 Daily Commits

on:
  schedule:
    # This runs at the 0th minute (on the hour) of every 2nd hour.
    # It will run at 00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, etc., UTC.
    - cron: '0 */2 * * *'

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Content & Commit
        run: |
          # 1. Create/Update a file with new content (e.g., current timestamp)
          DATE=$(date '+%Y-%m-%d %H:%M:%S')
          echo "Automated commit at: $DATE" >> commit_log.txt
          
          # 2. Configure Git user (required by github actions)
          git config --global user.name "An009"
          git config --global user.email "kreechanouar@gmail.com"
          
          # 3. Commit and Push (only if there are changes)
          git add commit_log.txt
          git commit -m "Automated hourly update: $DATE" || echo "No changes to commit"
          git push
