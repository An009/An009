name: An009 Ten Daily Commits

on:
  schedule:
    # Runs 10 times a day at the 0th minute of the specified hours UTC.
    - cron: '0 */2 * * *'

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Content & Commit
        run: |
          # 1. Create/Update a file with new content (e.g., current timestamp)
          DATE=$(date '+%Y-%m-%d %H:%M:%S')
          echo "Automated commit at: $DATE" >> commit_log.txt
          
          # 2. Configure Git user 
          git config --global user.name "An009"
          git config --global user.email "kreechanouar@gmail.com"
          
          # 3. Commit and Push
          git add commit_log.txt
          # The "|| echo" prevents the workflow from failing if there are no changes
          git commit -m "Automated 10x daily update: $DATE" || echo "No changes to commit"
          git push
