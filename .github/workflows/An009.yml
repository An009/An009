name: An009 Variable Daily Commits

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Variable Commits
        run: |
          # 1. Define your new specific commit counts
          NUMBERS=(10 12 13 14)
          
          # 2. Pick one number randomly from the list
          TARGET=${NUMBERS[$RANDOM % ${#NUMBERS[@]}]}
          echo "Today's target: $TARGET commits"

          # 3. Configure Git
          git config --global user.name "An009"
          git config --global user.email "kreechanouar@gmail.com"

          # 4. Loop to create the commits
          for ((i=1; i<=TARGET; i++))
          do
            DATE=$(date '+%Y-%m-%d %H:%M:%S')
            echo "Commit $i of $TARGET at $DATE" >> commit_log.txt
            
            git add commit_log.txt
            git commit -m "Automated update $i/$TARGET: $DATE"
            
            # Small sleep to ensure unique timestamps
            sleep 1 
          done

          # 5. Push all commits at once
          git push
